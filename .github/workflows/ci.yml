name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff<1' pyflakes

      - name: Syntax check
        run: python -m py_compile SwiftSlate.pyw

      - name: Pure-logic regression tests
        run: python -m unittest discover -s tests -v

      - name: Pyflakes (undefined names, unused imports)
        run: pyflakes SwiftSlate.pyw

      - name: Ruff (real bugs only)
        run: ruff check --select F,E9,B,UP024,UP041,PLW1510 SwiftSlate.pyw

      - name: Verify installer hashes match files
        run: |
          python - <<'PY'
          import hashlib, pathlib, re, sys

          text = pathlib.Path("install/Install-SwiftSlate.ps1").read_text(encoding="utf-8")
          for rel in ("SwiftSlate.pyw", "commands.json", "assets/icon.ico"):
              actual = hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest().upper()
              m = re.search(r'"' + re.escape(rel) + r'"\s*=\s*"([0-9A-Fa-f]{64})"', text)
              if not m or m.group(1).upper() != actual:
                  pinned = m.group(1) if m else "<missing>"
                  print(f"::error::{rel} hash mismatch: file is {actual}, installer pins {pinned}")
                  sys.exit(1)
              print(f"{rel}: hash OK")
          PY

      - name: Verify stdlib-only imports
        run: |
          python -c "import ast,sys,pathlib; t=ast.parse(pathlib.Path('SwiftSlate.pyw').read_text(encoding='utf-8')); m=set()
          for n in ast.walk(t):
              if isinstance(n,ast.Import): m|={a.name.split('.')[0] for a in n.names}
              elif isinstance(n,ast.ImportFrom) and n.level==0 and n.module: m.add(n.module.split('.')[0])
          bad=sorted(m-set(sys.stdlib_module_names)); assert not bad, 'non-stdlib imports: %s'%bad"
          echo "imports OK"

      - name: Keine Secrets
        run: |
          if grep -RInE '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git --exclude-dir=tests .; then
            echo "::error::Possible secret detected in repository"
            exit 1
          fi
          echo "secrets check OK"

      - name: PowerShell syntax check
        run: pwsh -NoProfile -Command '$errs = $null; [System.Management.Automation.Language.Parser]::ParseFile("install/Install-SwiftSlate.ps1", [ref]$null, [ref]$errs) > $null; if ($errs.Count) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 } else { Write-Host "install/Install-SwiftSlate.ps1 parses OK" }'
